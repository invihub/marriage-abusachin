<svg xmlns="http://www.w3.org/2000/svg" width="42" height="46" viewBox="0 0 42 46">
  <defs>
    <!-- clear centre, edges darken where the water bends the light -->
    <radialGradient id="body" cx=".44" cy=".4" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".88" stop-color="#4a7896" stop-opacity=".26"/>
      <stop offset="1" stop-color="#284f69" stop-opacity=".46"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glint" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
  </defs>
  <!-- soft shadow cast on the glass -->
  <ellipse cx="22" cy="25" rx="15" ry="16.5" fill="#14303f" fill-opacity=".2" filter="url(#soft)"/>
  <!-- the drop -->
  <ellipse cx="20" cy="22" rx="15" ry="16.5" fill="url(#body)"/>
  <ellipse cx="20" cy="22" rx="14.6" ry="16.1" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".7"/>
  <!-- light focused through the drop onto its lower edge -->
  <path d="M30.5 27.5A13 14 0 0 1 16 37.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.2"
    stroke-linecap="round" filter="url(#glint)"/>
  <!-- window reflection -->
  <ellipse cx="14" cy="14.5" rx="4.4" ry="2.7" transform="rotate(-35 14 14.5)" fill="#fff" fill-opacity=".95"/>
  <circle cx="25.5" cy="12" r="1.1" fill="#fff" fill-opacity=".75"/>
</svg>
