# Deploys the site to GitHub Pages, generating js/config.js from repository secrets.
# Setup: Settings -> Secrets and variables -> Actions -> add
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY   (never the secret key)
# Optional variable (not secret): SUPABASE_SCHEMA, defaults to abu_sachin
# and Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: List the soundtrack songs (js/songs.js)
        run: node scripts/build-songs.mjs

      - name: Generate js/config.js from secrets
        run: node scripts/build-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SCHEMA: ${{ vars.SUPABASE_SCHEMA || 'abu_sachin' }}

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html story.html organizer.html css js images songs story _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
