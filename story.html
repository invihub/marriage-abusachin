<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1220">
  <title>Our Story · Abu & Sachin</title>

  <meta name="description"
    content="The story of Abu and Sachin, from KCG College to Toronto to the wedding. Scroll to play it.">
  <meta property="og:title" content="Our Story · Abu & Sachin">
  <meta property="og:description" content="From KCG College to Toronto to the wedding. Scroll to play our story.">
  <meta property="og:url" content="https://invihub.github.io/marriage-abusachin/story.html">
  <meta property="og:image" content="https://invihub.github.io/marriage-abusachin/images/story-poster.jpg">
  <meta property="og:type" content="website">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,700&display=swap">

  <link rel="stylesheet" href="css/story.css">
</head>

<body>

  <!-- The film: js/story.js draws one frame of the invitation video for each
       scroll position (frames in story/frames/, cut by scripts/build-story-frames.py).
       Play shows the real video (story/film.mp4) over the frames. -->
  <div class="story-stage">
    <canvas id="story-backdrop" class="story-backdrop" width="27" height="40" aria-hidden="true"></canvas>
    <div id="story-screen" class="story-screen">
      <canvas id="story-frame" class="story-frame" role="img"
        aria-label="Illustrated film: Abu and Sachin's story, from KCG College in Chennai and the Thoothukudi harbour, through long-distance video calls and a reunion in Toronto, to the wedding on 6 December 2026 and the reception on 11 December 2026"></canvas>
      <video id="story-video" class="story-video" playsinline preload="none" aria-hidden="true"></video>
    </div>
  </div>

  <header class="story-top">
    <a href="index.html" class="story-pill story-back" data-back-link>
      <span aria-hidden="true">←</span> Invitation
    </a>
    <button type="button" id="story-play" class="story-pill story-play" aria-pressed="false">
      <span class="story-play-icon" aria-hidden="true">▶</span>
      <span class="story-play-label">Play with music</span>
    </button>
  </header>

  <footer class="story-bar">
    <p id="story-status" class="story-status">
      <span class="story-status-text">Loading our story…</span><span class="story-arrow" aria-hidden="true" hidden>↓</span>
    </p>

    <!-- Shown when the phone starts the film muted (opened from the gallery) -->
    <button type="button" id="story-sound" class="story-pill story-sound" hidden>
      <span aria-hidden="true">🔊</span> Tap for sound
    </button>

    <div id="story-end" class="story-end" hidden>
      <a href="index.html" class="story-cta" data-back-link>Back to the invitation</a>
      <button type="button" id="story-replay" class="story-pill">↺ Watch again</button>
    </div>

    <p id="story-chapter" class="story-chapter">Story of Abu &amp; Sachin</p>

    <!-- Progress through the film. Drag or tap to move; dots mark the chapters -->
    <div id="story-rail" class="story-rail" role="slider" tabindex="0" aria-label="Position in the story"
      aria-valuemin="0" aria-valuemax="114" aria-valuenow="0">
      <div class="story-rail-track">
        <div id="story-rail-fill" class="story-rail-fill"></div>
      </div>
    </div>
  </footer>

  <!-- Makes the page tall enough to scroll through the whole film
       (length set in js/story.js: secondsPerScreen) -->
  <div id="story-scroll" class="story-scroll" aria-hidden="true"></div>

  <noscript>
    <p class="story-noscript">This story plays as you scroll and needs JavaScript.
      <a href="index.html">Open the invitation</a></p>
  </noscript>

  <!-- Generated by scripts/build-story-frames.py: the list of frames -->
  <script src="story/frames.js"></script>
  <script src="js/back-link.js"></script>
  <script src="js/story.js"></script>

</body>

</html>
